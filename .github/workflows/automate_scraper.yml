name: Daily Nordnet Scraper

# 1. THE TRIGGER
on:
  schedule:
    # Runs at 15:00 UTC (17:00/18:00 in Finland depending on Daylight Savings) every Monday through Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # This adds a manual "Run workflow" button in GitHub so you can test it!

permissions:
  contents: write

# 2. THE SERVER SETUP
jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      # Upgraded to v4 to resolve Node warnings
      - name: Checkout repository
        uses: actions/checkout@v4

      # Upgraded to v5 to resolve Node warnings
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- THE FIX: Use requirements.txt and install openpyxl ---
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # 4. RUN THE SCRIPT
      - name: Execute Scraper
        run: python -u web_dashboard/scraper_json.py

      # 5. COMMIT THE NEW DATA
      - name: Commit and Push JSON Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_dashboard/data/*.json web_dashboard/data/*.png
          git commit -m "Automated data update from cloud scraper" || echo "No changes to commit"
          git push